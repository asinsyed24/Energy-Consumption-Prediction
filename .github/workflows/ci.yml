name: Energy Prediction CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile src/*.py
          python -m py_compile app/*.py

      - name: Test FastAPI application
        run: |
          python -c "from app.api import app; print('FastAPI application loaded successfully')"

      - name: Train ML model
        run: |
          python src/train.py

      - name: Check trained model
        run: |
          test -f models/energy_model.pkl
          echo "Model file exists"

      - name: Run data drift monitoring
        run: |
          python src/monitoring.py

      - name: Check Evidently report
        run: |
          test -f data_drift_report.html
          echo "Evidently report generated successfully"
